# Cloudflare Worker for the NRC WhatsApp front desk (SPEC-002). Not deployed yet.
name = "nrc-whatsapp-frontdesk"
main = "worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Every 15 minutes: one reminder per handover older than 2 hours, in daytime only.
[triggers]
crons = ["*/15 * * * *"]

# The answer base is bundled as text so approved wording keeps a single source.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Created on 2026-10-08 in the NRC Cloudflare account; the id is not a secret.
[[d1_databases]]
binding = "DB"
database_name = "nrc-whatsapp-frontdesk"
database_id = "fba3a2ca-41f8-4a29-9048-c5655056a8e8"

[vars]
# Anything other than "off" keeps shadow mode on: nothing is sent to prospects.
SHADOW_MODE = "on"

# Secrets, set with `wrangler secret put <NAME>`; never write them in this file:
#   YCLOUD_WEBHOOK_SECRET  YCLOUD_API_KEY  NRC_BUSINESS_PHONE  NRC_OWNER_PHONE
#   SHEET_ADAPTER_URL  SHEET_ADAPTER_TOKEN  STATE_KEY_SECRET
